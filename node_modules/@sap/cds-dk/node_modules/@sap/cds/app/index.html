<!DOCTYPE html>
<html lang="en">
<head>
  <title>${app.name}</title>
  <meta name="color-scheme" content="dark light">
  <link rel="stylesheet" href="/.cap/index.css">
  <script src="/.cap/index-client.js" defer></script>
</head>
<body>

  <label class="theme-switch" title="Toggle dark mode">
    <input id="theme-switch" type="checkbox" aria-label="Toggle dark mode">
    <span class="theme-switch-track" aria-hidden="true"><span class="theme-switch-sun">☀</span><span class="theme-switch-moon">☾</span></span>
  </label>

  <h1> Welcome to <i>@sap/cds</i> Server </h1>
  <p id="subtitle"> Serving <i>${app.name}</i> </p>


  <section id="webapps">
    <h2> Web Apps: </h2>
    <ul>
      <li><a href="${href}" target="_blank">${label}</a></li>
    </ul>
  </section>


  <section id="agents">
    <h2> Agents: </h2>
    <ul>
      <li>
        <a href="${href}" target="_blank" title="Chat Preview"> ${label} </a>
        <a href="${card}" target="_blank" class="agent-card-link"> Agent Card </a>
      </li>
    </ul>
  </section>


  <section id="provided-services" class="services">
    <h2> Services: </h2> <button class="toggle-button"></button>
    {{provided}}
  </section>

  <section id="required-services" class="services">
    <h2> Required Services: </h2> <button class="toggle-button"></button>
    {{required}}
  </section>


  <footer>
    This is an automatically generated page. <br>
    You can replace it with a custom <code>./${cds.folders.app}/index.html</code>.
  </footer>

</body>
</html>
