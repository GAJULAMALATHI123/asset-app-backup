<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>Table View</title>
  <style>
    /* ── Design tokens (aligned with the index page) ── */
    :root {
      --bg:            #f4f6f9;
      --panel:         #ffffff;
      --text:          #35485b;
      --muted:         #7b8c9c;
      --accent:        #355873;
      --accent-dark:   #29465d;
      --border:        #e2e8ee;
      --row-alt:       #f7f9fb;
      --row-hover:     #eef3f8;
      --head-bg:       #537492;
      --head-text:     #ffffff;
      --head-border:   #456182;
      --key-cell:      #2e4c66;
      --chip-bg:       #f0f3f7;
      --chip-border:   #dde4ea;
      --chip-text:     #4a6075;
      --chip-hover:    #e6ecf2;
      --error:         #c0392b;
      --radius:        6px;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg:          #0d1621;
        --panel:       #121d28;
        --text:        #c5d0d9;
        --muted:       #7e92a4;
        --accent:      #a8c1d2;
        --accent-dark: #c0d2df;
        --border:      #223040;
        --row-alt:     #15202b;
        --row-hover:   #1a2735;
        --head-bg:     #1e3a52;
        --head-text:   #dce7f0;
        --head-border: #163044;
        --key-cell:    #8fb6d6;
        --chip-bg:     #182532;
        --chip-border: #263646;
        --chip-text:   #a8c1d2;
        --chip-hover:  #1e2e3d;
        --error:       #e07070;
      }
    }
    :root[data-theme="dark"] {
      --bg:          #0d1621;
      --panel:       #121d28;
      --text:        #c5d0d9;
      --muted:       #7e92a4;
      --accent:      #a8c1d2;
      --accent-dark: #c0d2df;
      --border:      #223040;
      --row-alt:     #15202b;
      --row-hover:   #1a2735;
      --head-bg:     #1e3a52;
      --head-text:   #dce7f0;
      --head-border: #163044;
      --key-cell:    #8fb6d6;
      --chip-bg:     #182532;
      --chip-border: #263646;
      --chip-text:   #a8c1d2;
      --chip-hover:  #1e2e3d;
      --error:       #e07070;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: sans-serif;
      margin: 0; padding: 22px 26px;
      display: flex; flex-direction: column; overflow: hidden;
      background: var(--bg); color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    /* ── Header bar ── */
    header {
      display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px;
    }
    .row-top, .row-main {
      display: flex; align-items: center; gap: 12px; min-width: 0;
    }
    .row-main { margin-top: -7px; }
    .baseurl {
      font-size: .9rem; font-weight: 500; color: var(--muted);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      min-width: 0;
    }
    .baseurl a { color: inherit; text-decoration: none; }
    .baseurl a:hover { color: var(--accent); text-decoration: underline; }
    .verb {
      flex: none; cursor: pointer; font-family: inherit;
      font-size: .72rem; font-weight: 700; letter-spacing: .5px;
      color: #fff; background: var(--accent);
      border: 1px solid var(--accent); border-radius: var(--radius);
      padding: 4px 9px; line-height: 1; width: 48px;
      transition: background .15s ease, border-color .15s ease;
    }
    .verb:hover { background: var(--accent-dark); border-color: var(--accent-dark); }
    /* Align the server URL (bottom row) with the request URL text: GET button width + its padding. */
    .baseurl { margin-left: calc(48px + 9px); }
    .path-input {
      flex: 1 1 auto; min-width: 0; margin-left: -12px;
      font-family: inherit;
      font-size: .9rem; font-weight: 600; letter-spacing: .2px; font-style: italic;
      color: var(--text); background: transparent;
      border: 1px solid transparent; border-radius: var(--radius);
      padding: 4px 9px;
      transition: background .15s ease, border-color .15s ease;
    }
    .path-input:hover { border-color: var(--border); }
    .path-input:focus {
      outline: none; background: var(--panel);
      border-color: var(--accent);
    }
    .count {
      flex: none; margin-left: auto;
      font-size: .72rem; font-weight: 500; color: var(--muted);
      white-space: nowrap;
    }
    .actions { flex: none; margin-left: auto; display: flex; gap: 6px; align-items: center; }
    .chip {
      font-size: .76rem; font-weight: 500; cursor: pointer;
      color: var(--chip-text); background: var(--chip-bg);
      border: 1px solid var(--chip-border); border-radius: var(--radius);
      padding: 5px 11px; text-decoration: none; line-height: 1;
      display: inline-flex; align-items: center; gap: 6px;
      transition: background .15s ease, color .15s ease;
    }
    .chip:hover { background: var(--chip-hover); color: var(--accent); }
    .chip svg { width: 13px; height: 13px; opacity: .65; }
    .chip.disabled { opacity: .4; pointer-events: none; }

    /* ── Table panel ── */
    .scroll {
      overflow: auto; width: 100%; min-width: 0; min-height: 0; flex: 1;
      background: var(--panel); border: 1px solid var(--border);
      border-radius: var(--radius);
    }
    .scroll::-webkit-scrollbar { height: 10px; width: 10px; }
    .scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 5px; }
    .scroll::-webkit-scrollbar-thumb:hover { background: var(--chip-border); }
    .scroll::-webkit-scrollbar-track { background: transparent; }

    table { border-collapse: separate; border-spacing: 0; font-size: .84rem; width: 100%; }
    thead th {
      position: sticky; top: 0; z-index: 1;
      background: var(--head-bg);
      color: var(--head-text); font-weight: 600;
      font-size: .78rem; letter-spacing: .2px;
      padding: 9px 14px; text-align: left; white-space: nowrap;
      border-bottom: 1px solid var(--head-border);
      cursor: pointer; user-select: none;
      transition: opacity .15s ease;
    }
    thead th { opacity: 1; }
    thead th:hover { opacity: .85; }
    thead th.num { text-align: right; }
    thead th .colname { display: inline-flex; align-items: center; gap: 6px; }
    thead th.num .colname { flex-direction: row-reverse; }
    thead th.key .colname::before {
      content: ""; width: 5px; height: 5px; border-radius: 50%;
      background: #ffd36b; flex: none;
    }
    thead th .sort-ind { font-size: .6rem; line-height: 1; opacity: .9; color: inherit; }
    thead th[aria-sort], thead th[aria-sort] .colname { color: var(--head-text); }

    tbody td {
      padding: 7px 14px; white-space: nowrap;
      max-width: 320px; overflow: hidden; text-overflow: ellipsis;
      border-bottom: 1px solid var(--border); color: var(--text);
    }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr:nth-child(even) { background: var(--row-alt); }
    tbody tr:hover td { background: var(--row-hover); }
    td.num { text-align: right; font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }
    td.key { color: var(--key-cell); font-weight: 600; }
    td .null { color: var(--muted); opacity: .6; }
    td .obj {
      font-size: .74rem; color: var(--muted);
      background: var(--chip-bg); border: 1px solid var(--chip-border);
      padding: 1px 7px; border-radius: 4px;
    }

    /* ── States ── */
    .state {
      flex: 1; display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 8px; color: var(--muted);
      background: var(--panel); border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 40px; text-align: center;
    }
    .state .big { font-size: 1.1rem; font-weight: 600; color: var(--text); }
    .error { color: var(--error); }
    .error .code {
      display: inline-block; font-weight: 700; margin-right: 8px;
      font-variant-numeric: tabular-nums;
    }
    code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .82em; }
    a { color: var(--accent); }
  </style>
</head>
<body>
  <header>
    <div class="row-top">
      <button class="verb" id="get-btn" type="button" title="Send request">GET</button>
      <input class="path-input" id="path-input" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="Request path — edit and press Enter to send">
      <div class="actions" id="actions"></div>
    </div>
    <div class="row-main">
      <div class="baseurl" id="baseurl"></div>
      <span class="count" id="count"></span>
    </div>
  </header>
  <div class="scroll" id="out"></div>
  <script src="/.cap/table.js"></script>
</body>
</html>
